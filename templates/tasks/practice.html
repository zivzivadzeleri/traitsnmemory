<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="task-container">

    <div id="stimulus"
         class="exposure-word">
        +
    </div>

    <div id="stem-section">

        <div id="stem"
             class="stem-word">
        </div>

        <input type="text"
               id="responseInput"
               autocomplete="off">

        <br>

        <button id="nextButton">
            შემდეგი
        </button>

    </div>

</div>


<div class="practice-label">

    ეს არის სავარჯიშო დავალება.  
    პასუხები არ შეინახება.

</div>


<script>

const exposureWords = [
    "საათი",
    "ვარსკვლავი",
    "გული",
    "ცხელი",
    "ხერხი",
    "ყური",
    "მიწა",
    "კარადა",
    "თვალი",
    "საქართველო"
];

function makeStem(word) {

    if (word.length <= 3) {
        return word;
    }

    return word.substring(0, 3) + "...";
}


function shuffleArray(array) {

    return [...array].sort(() => Math.random() - 0.5);
}

const selectedWords = shuffleArray(exposureWords).slice(0, 3);

const stimulusDiv = document.getElementById("stimulus");

const stemSection = document.getElementById("stem-section");

const stemDiv = document.getElementById("stem");

const responseInput = document.getElementById("responseInput");

const nextButton = document.getElementById("nextButton");

let currentWord = 0;

let currentStem = 0;

let reactionStart = 0;

const responses = [];

function startExperiment() {

    stimulusDiv.innerHTML = "+";

    setTimeout(() => {

        showNextWord();

    }, 2000);
}

function showNextWord() {

    if (currentWord >= exposureWords.length) {

        startCountdown();

        return;
    }

    stimulusDiv.innerHTML = exposureWords[currentWord];

    setTimeout(() => {

        stimulusDiv.innerHTML = "";

    }, 200);

    setTimeout(() => {

        currentWord++;

        showNextWord();

    }, 1500);
}


function startCountdown() {

    let timeLeft = 20;

    stimulusDiv.innerHTML = `
        <div style="font-size:24px; text-align:center;">

            გთხოვთ, დაიწყოთ 20-დან უკუთვლა
            ორ-ორი რიცხვის გამოტოვებით:

            <br><br>

            20, 18, 16, 14...

            <br><br>

            დარჩენილი დრო:

            <br><br>

            <span id="timer">${timeLeft}</span>

        </div>
    `;

    const timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").innerText =
            timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            stimulusDiv.innerHTML = "";

            startStemTask();
        }

    }, 1000);
}


function startStemTask() {

    stemSection.style.display = "block";

    showStem();
}

function showStem() {

    if (currentStem >= selectedWords.length) {

        finishTask();

        return;
    }

    stemDiv.innerHTML = makeStem(selectedWords[currentStem]);

    responseInput.value = "";

    reactionStart = performance.now();

    responseInput.focus();
}

nextButton.addEventListener("click", () => {

    const reactionTime = performance.now() - reactionStart;

    responses.push({

        stem: makeStem(selectedWords[currentStem]),
        shown_word: selectedWords[currentStem],

        response: responseInput.value,

        rt: reactionTime
    });

    currentStem++;

    showStem();

});

function finishTask() {

    document.body.innerHTML = `

    <div class="container">

        <h2>
            სავარჯიშო დავალება დასრულდა
        </h2>

        <p style="margin-top:20px;">
            შეგიძლიათ:
        </p>

        <button onclick="repeatPractice()"
                style="margin-top:20px;">
            სავარჯიშოს გამეორება
        </button>

        <br><br>

        <button onclick="startMainTasks()">
            მთავარ ნაწილზე გადასვლა
        </button>

    </div>
    `;
}

function repeatPractice() {

    window.location.href = "/practice_task";
}

function startMainTasks() {

    window.location.href = "/next_task";
}



startExperiment();

</script>

</body>
</html>
